
name: CI Ivan events

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t events-api:latest .

      - name: Start Events API container
        run: docker run -d -p 5000:5000 --name events-api-ci events-api:latest

      - name: Check API health
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://localhost:5000/api/health; then
              echo "Events API is healthy!"
              exit 0
            fi
            echo "Waiting for Events API..."
            sleep 2
          done
          echo "Events API health check failed!"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests

      - name: Run pytest tests
        run: python -m pytest tests/ -v

      - name: Stop and remove Docker container
        if: always()
        run: |
          docker stop events-api-ci || true
          docker rm events-api-ci || true
          

  deploy:
    name: Deploy to Render
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t vasilevivan/events-api:latest .

      - name: Push Docker image
        run: docker push vasilevivan/events-api:latest

      - name: Trigger Render deployment
        run: curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Smoke test Render deployment
        env:
          RENDER_BASE_URL: ${{ vars.RENDER_BASE_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          echo "Waiting for Render to deploy commit $EXPECTED_SHA"

          for i in {1..60}; do
            RESPONSE=$(curl --silent --show-error \
              --max-time 10 \
              "$RENDER_BASE_URL/api/health" || true)

            echo "Attempt $i: $RESPONSE"

            if echo "$RESPONSE" | python -c '
          import json
          import os
          import sys

          try:
              data = json.load(sys.stdin)
              valid = (
                  data.get("status") == "healthy"
                  and data.get("version") == os.environ["EXPECTED_SHA"]
              )
              sys.exit(0 if valid else 1)
          except (ValueError, AttributeError):
              sys.exit(1)
          '; then
              echo "Smoke test passed! Correct version is live."
              exit 0
            fi

            sleep 10
          done

          echo "Smoke test failed: expected version not deployed."
          exit 1
